<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - YMH219 Önizleme</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #2c3e50; font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .game-wrapper { position: relative; text-align: center; }
        canvas {
            display: block; border: 4px solid #2c3e50; border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5); cursor: pointer;
        }
        .score-display {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 48px; font-weight: bold; color: white;
            text-shadow: 2px 2px 0px #2c3e50, -1px -1px 0px #2c3e50, 1px -1px 0px #2c3e50, -1px 1px 0px #2c3e50;
            z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="score-display" id="scoreDisplay"></div>
        <canvas id="gameCanvas" width="500" height="600"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');

        // Kuş görseli yükle
        const birdImg = new Image();
        birdImg.src = 'bird.png';

        const GRAVITY = 0.45;
        const JUMP_FORCE = -7.5;
        const PIPE_WIDTH = 60;
        const PIPE_GAP = 150;
        let PIPE_SPEED = 2.8;
        const GROUND_HEIGHT = 80;
        const BIRD_W = 45, BIRD_H = 35;

        const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let state = STATE.MENU, score = 0, best = parseInt(localStorage.getItem('fb_best')) || 0, frame = 0;
        let bird = { x: 80, y: 300, v: 0 };
        let pipes = [], clouds = [
            {x:50,y:60},{x:180,y:100},{x:320,y:45},{x:460,y:85}
        ];
        let groundX = 0;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'gameplay') {
            state = STATE.PLAYING;
            score = 3;
            bird.y = 230;
            bird.v = -2;
            pipes = [
                { x: 250, top: 160, scored: false },
                { x: 470, top: 210, scored: false }
            ];
        }

        function drawSky() {
            const g = ctx.createLinearGradient(0,0,0,canvas.height-GROUND_HEIGHT);
            g.addColorStop(0,'#4ec0ca'); g.addColorStop(1,'#71c5cf');
            ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height-GROUND_HEIGHT);
        }
        function drawClouds() {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x,c.y,22,0,Math.PI*2); ctx.arc(c.x+20,c.y-8,16,0,Math.PI*2);
                ctx.arc(c.x-18,c.y+2,14,0,Math.PI*2); ctx.arc(c.x+8,c.y-14,14,0,Math.PI*2);
                ctx.fill();
            });
        }
        function drawGround() {
            const gy = canvas.height - GROUND_HEIGHT;
            ctx.fillStyle = '#ded895'; ctx.fillRect(0,gy,canvas.width,GROUND_HEIGHT);
            ctx.fillStyle = '#d2b04c'; ctx.fillRect(0,gy,canvas.width,4);
            ctx.fillStyle = '#c8a83e';
            const off = ((groundX%40)+40)%40;
            for(let i=-off; i<canvas.width+40; i+=40){
                ctx.beginPath(); ctx.moveTo(i,gy+15); ctx.lineTo(i+20,gy+5); ctx.lineTo(i+40,gy+15); ctx.fill();
            }
        }
        function drawPipe(x, topH) {
            const botY = topH + PIPE_GAP, botH = canvas.height - GROUND_HEIGHT - botY;
            const capH = 26, capO = 5;
            // Üst gövde
            const pg = ctx.createLinearGradient(x,0,x+PIPE_WIDTH,0);
            pg.addColorStop(0,'#558b2f'); pg.addColorStop(0.3,'#8bc34a'); pg.addColorStop(0.5,'#73bf2e'); pg.addColorStop(1,'#558b2f');
            ctx.fillStyle = pg;
            ctx.fillRect(x,0,PIPE_WIDTH,topH-capH);
            // Üst kapak
            ctx.fillStyle = '#64b425';
            ctx.fillRect(x-capO,topH-capH,PIPE_WIDTH+capO*2,capH);
            ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 2;
            ctx.strokeRect(x-capO,topH-capH,PIPE_WIDTH+capO*2,capH);
            // Işık
            ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x+6,0,8,topH-capH);
            // Alt kapak
            ctx.fillStyle = '#64b425';
            ctx.fillRect(x-capO,botY,PIPE_WIDTH+capO*2,capH);
            ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 2;
            ctx.strokeRect(x-capO,botY,PIPE_WIDTH+capO*2,capH);
            // Alt gövde
            ctx.fillStyle = pg;
            ctx.fillRect(x,botY+capH,PIPE_WIDTH,botH-capH);
            ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x+6,botY+capH,8,botH-capH);
        }
        function drawBird() {
            ctx.save();
            let angle = Math.min(bird.v*3, 70) * Math.PI/180;
            if(state === STATE.MENU) angle = 0;
            ctx.translate(bird.x+BIRD_W/2, bird.y+BIRD_H/2);
            ctx.rotate(angle);
            if(birdImg.complete && birdImg.naturalWidth > 0) {
                ctx.drawImage(birdImg, -BIRD_W/2, -BIRD_H/2, BIRD_W, BIRD_H);
            } else {
                // Yedek çizim
                ctx.fillStyle = '#e696aa';
                ctx.beginPath(); ctx.ellipse(0,0,BIRD_W/2,BIRD_H/2,0,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(10,-4,7,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(18,-2,7,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(13,-3,3,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(21,-1,3,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#f08c32';
                ctx.beginPath(); ctx.moveTo(BIRD_W/2-2,0); ctx.lineTo(BIRD_W/2+8,3); ctx.lineTo(BIRD_W/2-2,6); ctx.fill();
            }
            ctx.restore();
        }
        function drawMenu() {
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 4;
            ctx.font = 'bold 42px Arial'; ctx.textAlign = 'center';
            ctx.strokeText('Flappy Bird', canvas.width/2, 170);
            ctx.fillText('Flappy Bird', canvas.width/2, 170);
            ctx.font = '16px Arial'; ctx.lineWidth = 2;
            ctx.strokeText('SPACE veya Tıkla → Başla', canvas.width/2, 380);
            ctx.fillText('SPACE veya Tıkla → Başla', canvas.width/2, 380);
            if(best > 0) {
                ctx.fillStyle = '#ffd700'; ctx.font = '15px Arial';
                ctx.strokeText('En İyi Skor: '+best, canvas.width/2, 415);
                ctx.fillText('En İyi Skor: '+best, canvas.width/2, 415);
            }
        }
        function drawGameOver() {
            ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            const pw=250,ph=210,px=(canvas.width-pw)/2,py=(canvas.height-ph)/2-25;
            ctx.fillStyle = '#deb887'; ctx.fillRect(px,py,pw,ph);
            ctx.strokeStyle = '#8b6914'; ctx.lineWidth = 4; ctx.strokeRect(px,py,pw,ph);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#c0392b'; ctx.font = 'bold 32px Arial';
            ctx.fillText('Game Over', canvas.width/2, py+48);
            ctx.fillStyle = '#2c3e50'; ctx.font = '20px Arial';
            ctx.fillText('Skor: '+score, canvas.width/2, py+95);
            ctx.fillStyle = '#e67e22';
            ctx.fillText('En İyi: '+best, canvas.width/2, py+130);
            if(score >= best && score > 0) {
                ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 16px Arial';
                ctx.fillText('★ YENİ REKOR! ★', canvas.width/2, py+165);
            }
            ctx.fillStyle = '#fff'; ctx.font = '14px Arial';
            ctx.fillText('Tekrar oynamak için tıkla', canvas.width/2, py+ph+35);
        }
        function drawScore() {
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3; ctx.font = 'bold 44px Arial'; ctx.textAlign = 'center';
            ctx.strokeText(score, canvas.width/2, 60);
            ctx.fillText(score, canvas.width/2, 60);
        }

        function jump() {
            if(state === STATE.MENU) {
                state = STATE.PLAYING; bird.v = JUMP_FORCE;
                pipes = []; score = 0; frame = 0; PIPE_SPEED = 2.8;
                scoreDisplay.textContent = '';
            } else if(state === STATE.PLAYING) {
                bird.v = JUMP_FORCE;
            } else {
                state = STATE.MENU; bird = {x:80,y:300,v:0}; pipes = []; score = 0; PIPE_SPEED = 2.8;
                scoreDisplay.textContent = '';
            }
        }

        function spawnPipe() {
            const minT=60, maxT=canvas.height-GROUND_HEIGHT-PIPE_GAP-60;
            pipes.push({x:canvas.width, top:Math.floor(Math.random()*(maxT-minT))+minT, scored:false});
        }

        function update() {
            frame++;
            clouds.forEach((c,i) => { c.x -= 0.4; if(c.x < -50) c.x = canvas.width+50; });

            if(state === STATE.MENU) {
                bird.y = 300 + Math.sin(frame*0.05)*20;
                groundX += 1;
            } else if(state === STATE.PLAYING) {
                bird.v += GRAVITY; bird.y += bird.v;
                if(frame % 90 === 0) spawnPipe();
                pipes.forEach(p => {
                    p.x -= PIPE_SPEED;
                    if(!p.scored && p.x + PIPE_WIDTH < bird.x) {
                        p.scored = true; score++;
                        if(score % 5 === 0 && PIPE_SPEED < 5.5) PIPE_SPEED += 0.25;
                    }
                });
                pipes = pipes.filter(p => p.x > -PIPE_WIDTH-20);
                groundX += PIPE_SPEED;
                // Çarpışma
                const bL=bird.x+4, bR=bird.x+BIRD_W-4, bT=bird.y+4, bB=bird.y+BIRD_H-4;
                if(bB >= canvas.height-GROUND_HEIGHT || bT <= 0) { gameOver(); return; }
                for(const p of pipes) {
                    if(bR > p.x && bL < p.x+PIPE_WIDTH) {
                        if(bT < p.top || bB > p.top+PIPE_GAP) { gameOver(); return; }
                    }
                }
            }
        }
        function gameOver() {
            state = STATE.GAMEOVER;
            if(score > best) { best = score; localStorage.setItem('fb_best', best); }
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            drawSky(); drawClouds();
            pipes.forEach(p => drawPipe(p.x, p.top));
            drawGround(); drawBird();
            if(state === STATE.PLAYING) drawScore();
            if(state === STATE.MENU) drawMenu();
            if(state === STATE.GAMEOVER) drawGameOver();
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }

        canvas.addEventListener('click', e => { e.preventDefault(); jump(); });
        document.addEventListener('keydown', e => {
            if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault(); jump();}
        });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

        loop();
    </script>
</body>
</html>
